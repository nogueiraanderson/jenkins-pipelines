- job:
    name: pxb-filter-probe-9x-param
    project-type: matrix
    defaults: global
    description: |
        Probe of the 9.x combination filter with WITH_AARCH64. Each cell only prints its axes.
    disabled: false
    concurrent: true
    node: launcher-x64
    properties:
    - build-discarder:
        num-to-keep: 20
    parameters:
    - string:
        name: BRANCH
        default: "trunk"
        description: Stands in for the parameters that the trunk job sends
    - bool:
        name: WITH_AARCH64
        default: false
        description: "Add the aarch64 cells"
    axes:
    - axis:
        name: CMAKE_BUILD_TYPE
        type: user-defined
        values:
          - RelWithDebInfo
          - Debug
    - axis:
        type: user-defined
        name: DOCKER_OS
        values:
        - oraclelinux:9
        - ubuntu:jammy
        - ubuntu:noble
        - debian:bookworm
        - debian:trixie
        - amazonlinux:2023
        - asan
    - axis:
        type: user-defined
        name: ARCH
        values:
        - x86_64
        - aarch64
    execution-strategy:
      combination-filter: >-
        (ARCH == "x86_64" && DOCKER_OS != "amazonlinux:2023") ||
        (DOCKER_OS == "amazonlinux:2023" && CMAKE_BUILD_TYPE == "RelWithDebInfo" &&
        (ARCH == "x86_64" || WITH_AARCH64 == "true"))
    builders:
    - shell: |
        echo "cell ARCH=${{ARCH}} DOCKER_OS=${{DOCKER_OS}} CMAKE_BUILD_TYPE=${{CMAKE_BUILD_TYPE}} WITH_AARCH64=${{WITH_AARCH64}}"
